name: Release

# Every push to main builds the APK and publishes a GitHub release tagged v1.0.<run number>.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/dependabot.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 not set; signing the release APK with the debug key"
          fi

      - name: Build release APK
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "fireassistant-${TAG}.apk"
          gh release create "$TAG" "fireassistant-${TAG}.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
